<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パパノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="スマホからひとこと・写真・タグで育児の記録を残して、あとで振り返るパパの記録帳。">
<title>パパノート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;500;600&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* Layout: one narrow column like a pocket notebook; composer on top, the day-by-day log below, a second tab for looking back. */
:root {
  --paper: #f3f5f2;
  --sheet: #ffffff;
  --ink: #1d2733;
  --ink-soft: #5b6673;
  --rule: #dfe3dd;
  --accent: #2c6a86;
  --accent-ink: #ffffff;
  --accent-wash: #e3eef3;
  --mark: #e2a72e;
  --mark-wash: #fbf0d6;
  --danger: #b4443a;

  --t-first: #e2a72e;
  --t-bath: #3a8fb7;
  --t-sleep: #6b6fb5;
  --t-milk: #8aa7a0;
  --t-play: #4f9a5d;
  --t-out: #c07a3d;
  --t-hard: #a35a6b;
  --t-happy: #d36f8f;

  --f-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --f-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12171c; --sheet: #1a2128; --ink: #e6ebef; --ink-soft: #9aa6b1; --rule: #2a333c;
    --accent: #6fb3d2; --accent-ink: #0f1a20; --accent-wash: #1d3340; --mark: #f0bb4f; --mark-wash: #3a2f17; --danger: #e0786d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12171c; --sheet: #1a2128; --ink: #e6ebef; --ink-soft: #9aa6b1; --rule: #2a333c;
  --accent: #6fb3d2; --accent-ink: #0f1a20; --accent-wash: #1d3340; --mark: #f0bb4f; --mark-wash: #3a2f17; --danger: #e0786d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; display: flex; flex-direction: column; gap: 18px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.brand { font-family: var(--f-display); font-weight: 800; font-size: 13px; letter-spacing: .12em; color: var(--accent); }
.kid { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.age { font-family: var(--f-mono); font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.age b { color: var(--ink); font-weight: 500; font-size: 15px; }
.icon-btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--ink-soft); }

/* tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 9px; padding: 8px; font-weight: 600; color: var(--ink-soft); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

/* composer */
.composer { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 0 var(--rule); }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; border: 0; background: transparent; font-size: 17px; line-height: 1.55; padding: 0; }
.composer textarea::placeholder { color: var(--ink-soft); opacity: .8; }
.composer textarea:focus { outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.chip[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.chip[aria-pressed="true"] i { background: #fff; }
.chip.static { padding: 1px 8px; font-size: 12px; color: var(--ink-soft); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row .spacer { flex: 1; }
.ghost { border: 1px dashed var(--rule); background: transparent; border-radius: 10px; padding: 7px 12px; font-size: 13px; color: var(--ink-soft); display: inline-flex; gap: 6px; align-items: center; }
.when { font-family: var(--f-mono); font-size: 13px; color: var(--ink-soft); background: transparent; border: 0; padding: 4px 0; text-decoration: underline dotted; text-underline-offset: 3px; }
.when-input { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 6px 8px; font-size: 14px; }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 9px 20px; }
.primary:disabled { opacity: .45; cursor: default; }
.preview { position: relative; width: 96px; }
.preview img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; }
.preview button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); font-size: 13px; line-height: 1; }

/* sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-h h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 17px; }
.sec-h small { color: var(--ink-soft); font-size: 12px; }
.note { color: var(--ink-soft); font-size: 13px; margin: 0; }

/* timeline */
.day { display: flex; flex-direction: column; gap: 8px; }
.day-h { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.day-h strong { font-family: var(--f-display); font-weight: 700; font-size: 15px; }
.day-h span { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.entry { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 4px 0; }
.entry time { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); padding-top: 3px; font-variant-numeric: tabular-nums; }
.entry .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry.first .body { background: var(--mark-wash); border-radius: 10px; padding: 8px 10px; margin-left: -10px; }
.entry img.photo { width: 100%; max-width: 340px; max-height: 340px; object-fit: cover; border-radius: 12px; display: block; background: var(--rule); }
.entry .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.del { margin-left: auto; border: 0; background: transparent; color: var(--ink-soft); font-size: 12px; padding: 2px 4px; }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.confirm .danger { border: 0; background: var(--danger); color: #fff; border-radius: 8px; padding: 4px 10px; }
.confirm .cancel { border: 1px solid var(--rule); background: transparent; border-radius: 8px; padding: 4px 10px; }
.more { align-self: center; }

/* look-back cards */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.memory { background: var(--accent-wash); border-color: transparent; }
.memory-label { font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--accent); letter-spacing: .04em; }
.month-nav { display: flex; align-items: center; gap: 8px; }
.month-nav button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; width: 32px; height: 32px; }
.month-nav span { font-family: var(--f-display); font-weight: 700; min-width: 7.5em; text-align: center; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 12px; color: var(--ink-soft); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bar { display: grid; grid-template-columns: 6.5em 1fr 2.5em; align-items: center; gap: 8px; font-size: 13px; }
.bar .track { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--c); border-radius: 4px; }
.bar .n { font-family: var(--f-mono); text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; max-width: 100%; }
.firsts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.firsts li { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.firsts li:last-child { border-bottom: 0; }
.firsts .d { font-family: var(--f-mono); font-size: 12px; color: var(--mark); font-variant-numeric: tabular-nums; padding-top: 2px; }
.firsts p { margin: 0; overflow-wrap: anywhere; }

/* empty state */
.empty { border: 1px dashed var(--rule); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.example { opacity: .7; }
.example-tag { font-size: 11px; letter-spacing: .1em; color: var(--ink-soft); }

/* settings */
.settings { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.settings label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-soft); }
.settings input { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 16px; color: var(--ink); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 10; }
.status { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 24px 0; }

@media (prefers-reduced-motion: no-preference) {
  .entry.just { animation: pop .5s ease-out; }
  @keyframes pop { from { background: var(--accent-wash); } to { background: transparent; } }
}
</style>
<style>
/* Standalone page: what the artifact skeleton used to provide. */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

.backup { border-top: 1px solid var(--rule); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.backup h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--ink); }
.backup .warn { color: var(--danger); }
.reminder { background: var(--mark-wash); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.reminder span { flex: 1; min-width: 12em; }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">パパノート</div>
      <div class="kid" id="kidName">わが子</div>
      <div class="age" id="kidAge">誕生日を入れると「生後○日」が出ます</div>
    </div>
    <button class="icon-btn" id="openSettings" type="button">設定</button>
  </header>

  <section class="settings" id="settings" hidden>
    <label for="setName">子どもの名前（ニックネームでもOK）
      <input id="setName" type="text" maxlength="30" placeholder="例：はるくん">
    </label>
    <label for="setBirth">誕生日
      <input id="setBirth" type="date">
    </label>
    <div class="row"><span class="spacer"></span>
      <button class="ghost" id="cancelSettings" type="button">閉じる</button>
      <button class="primary" id="saveSettings" type="button">保存</button>
    </div>
    <div class="backup">
      <h3>バックアップ</h3>
      <p class="note">記録と写真はこのスマホの中だけに保存されています。機種変更やブラウザのデータ削除で消えないよう、ときどきファイルに書き出してください。</p>
      <p class="note" id="lastBackup"></p>
      <div class="row">
        <button class="ghost" id="exportBtn" type="button">ファイルに書き出す</button>
        <label class="ghost" for="importFile">ファイルから読み込む</label>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>

  <div class="reminder" id="reminder" hidden>
    <span id="reminderText"></span>
    <button class="ghost" id="reminderBtn" type="button">いま書き出す</button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tabWrite" aria-selected="true" type="button">書く</button>
    <button role="tab" id="tabLook" aria-selected="false" type="button">ふりかえる</button>
  </nav>

  <!-- 書く -->
  <main id="paneWrite" class="sec">
    <form class="composer" id="composer">
      <textarea id="text" placeholder="今日のひとこと。例：お風呂で初めて声を出して笑った"></textarea>
      <div class="chips" id="tagPicker"></div>
      <div id="previewSlot"></div>
      <div class="row">
        <label class="ghost" for="photo">写真を添える</label>
        <input id="photo" type="file" accept="image/*" hidden>
        <button class="when" id="whenBtn" type="button"></button>
        <input class="when-input" id="whenInput" type="datetime-local" hidden>
        <span class="spacer"></span>
        <button class="primary" id="saveBtn" type="submit" disabled>残す</button>
      </div>
    </form>

    <div class="sec">
      <div class="sec-h"><h2>最近の記録</h2><small id="countLabel"></small></div>
      <div id="timeline"><div class="status">読み込み中…</div></div>
    </div>
  </main>

  <!-- ふりかえる -->
  <section id="paneLook" class="sec" hidden>
    <div id="memories"></div>

    <div class="card">
      <div class="sec-h">
        <h2>月のまとめ</h2>
        <div class="month-nav">
          <button type="button" id="prevMonth" aria-label="前の月">‹</button>
          <span id="monthLabel"></span>
          <button type="button" id="nextMonth" aria-label="次の月">›</button>
        </div>
      </div>
      <div id="monthBody"></div>
    </div>

    <div class="card">
      <div class="sec-h"><h2>はじめてコレクション</h2><small>「はじめて」タグの記録</small></div>
      <div id="firsts"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>タグで読み返す</h2></div>
      <div class="chips" id="filterPicker"></div>
      <div id="filtered"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const TAGS = [
  { id: "first", label: "はじめて", c: "var(--t-first)" },
  { id: "bath", label: "お風呂", c: "var(--t-bath)" },
  { id: "sleep", label: "寝かしつけ", c: "var(--t-sleep)" },
  { id: "milk", label: "ミルク", c: "var(--t-milk)" },
  { id: "play", label: "あそび", c: "var(--t-play)" },
  { id: "out", label: "おでかけ", c: "var(--t-out)" },
  { id: "happy", label: "うれしかった", c: "var(--t-happy)" },
  { id: "hard", label: "大変だった", c: "var(--t-hard)" },
];
const TAG = Object.fromEntries(TAGS.map(t => [t.id, t]));
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const BACKUP_REMIND_DAYS = 30;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const localDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const toLocalInput = d => `${localDay(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const newId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- storage (IndexedDB, on this device) ---------- */
const store = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("papa-note", 1);
      req.onupgradeneeded = () => {
        const d = req.result;
        d.createObjectStore("entries", { keyPath: "id" });
        d.createObjectStore("photos");
        d.createObjectStore("settings");
      };
      req.onsuccess = () => { this.db = req.result; resolve(); };
      req.onerror = () => reject(req.error);
    });
  },
  run(names, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction(names, mode);
      const out = fn(...[].concat(names).map(n => tx.objectStore(n)));
      tx.oncomplete = () => resolve(out instanceof IDBRequest ? out.result : out);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  },
  allEntries() { return this.run("entries", "readonly", s => s.getAll()); },
  putEntry(e, photo) {
    return this.run(["entries", "photos"], "readwrite", (es, ps) => {
      es.put(e);
      if (photo && e.photo) ps.put(photo, e.photo);
    });
  },
  deleteEntry(e) {
    return this.run(["entries", "photos"], "readwrite", (es, ps) => {
      es.delete(e.id);
      if (e.photo) ps.delete(e.photo);
    });
  },
  photo(id) { return this.run("photos", "readonly", s => s.get(id)); },
  setting(key) { return this.run("settings", "readonly", s => s.get(key)); },
  setSetting(key, value) { return this.run("settings", "readwrite", s => s.put(value, key)); },
};

let ready = false;
let entries = [], loaded = false, child = null, lastBackup = null;
let tab = "write", selTags = new Set(), photoBlob = null, photoUrl = null, customWhen = null;
let shown = 40, confirmId = null, justId = null, filterTag = "first";
let monthCursor = new Date(); monthCursor.setDate(1);
const photoURLs = new Map();

async function loadAll() {
  const list = await store.allEntries();
  entries = list.filter(e => e.day && e.at).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
  child = (await store.setting("child")) || null;
  lastBackup = (await store.setting("lastBackup")) || null;
  loaded = true;
}

/* Photos live as Blobs in IndexedDB; images render with data-photo and get their src filled in here. */
async function hydratePhotos(root) {
  for (const img of root.querySelectorAll("img[data-photo]:not([src])")) {
    const id = img.dataset.photo;
    let url = photoURLs.get(id);
    if (!url) {
      const blob = await store.photo(id).catch(() => null);
      if (!blob) { img.alt = "（写真が見つかりません）"; continue; }
      url = URL.createObjectURL(blob);
      photoURLs.set(id, url);
    }
    img.src = url;
  }
}

/* ---------- age ---------- */
function ageParts(dayStr) {
  if (!child?.birthday) return null;
  const b = parseDay(child.birthday), d = parseDay(dayStr);
  const days = Math.round((d - b) / 86400000);
  if (days < 0) return null;
  let months = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
  if (d.getDate() < b.getDate()) months--;
  return { days, months };
}
function ageLabel(dayStr) {
  const a = ageParts(dayStr);
  if (!a) return "";
  if (a.months < 1) return `生後${a.days}日`;
  const y = Math.floor(a.months / 12), m = a.months % 12;
  return (y ? `${y}歳` : "") + (m || !y ? `${m}ヶ月` : "") + `・${a.days}日目`;
}
function dayTitle(dayStr) {
  const d = parseDay(dayStr), today = localDay(new Date());
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (dayStr === today) return "今日";
  if (dayStr === localDay(y)) return "きのう";
  const base = `${d.getMonth() + 1}月${d.getDate()}日(${WD[d.getDay()]})`;
  return d.getFullYear() === new Date().getFullYear() ? base : `${d.getFullYear()}年${base}`;
}

/* ---------- header ---------- */
function renderHeader() {
  $("kidName").textContent = child?.name || "わが子";
  const today = localDay(new Date());
  const a = ageParts(today);
  $("kidAge").innerHTML = a
    ? `<b>生後${a.days}日</b>　${a.months >= 1 ? esc(ageLabel(today).split("・")[0]) : ""}`
    : "設定から誕生日を入れると「生後○日」が出ます";
}
function renderBackupInfo() {
  $("lastBackup").textContent = lastBackup
    ? `最後に書き出した日：${new Date(lastBackup).toLocaleDateString("ja-JP")}`
    : "まだ書き出したことはありません。";
  const days = lastBackup ? (Date.now() - new Date(lastBackup)) / 86400000 : Infinity;
  const need = entries.length >= 5 && days > BACKUP_REMIND_DAYS;
  $("reminder").hidden = !need;
  if (need) $("reminderText").textContent = lastBackup
    ? `最後のバックアップから${Math.floor(days)}日たちました。記録が消えないよう書き出しておきましょう。`
    : `記録が${entries.length}件になりました。消えないようにバックアップを書き出しておきましょう。`;
}

/* ---------- composer ---------- */
function renderTagPicker() {
  $("tagPicker").innerHTML = TAGS.map(t =>
    `<button type="button" class="chip" style="--c:${t.c}" data-tag="${t.id}" aria-pressed="${selTags.has(t.id)}"><i></i>${t.label}</button>`).join("");
}
function renderWhen() {
  const d = customWhen || new Date();
  $("whenBtn").textContent = customWhen ? `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())} に記録` : `いま ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderPreview() {
  $("previewSlot").innerHTML = photoUrl ? `<div class="preview"><img src="${photoUrl}" alt="添付する写真"><button type="button" id="dropPhoto" aria-label="写真を外す">×</button></div>` : "";
}
function updateSaveState() {
  $("saveBtn").disabled = !ready || (!$("text").value.trim() && !photoBlob);
}

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
    return blob || file;
  } catch { return file; }
}

async function save(e) {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!ready || (!text && !photoBlob)) return;
  const btn = $("saveBtn"); btn.disabled = true; btn.textContent = "保存中…";
  try {
    const at = customWhen || new Date();
    const entry = {
      id: newId(), text, tags: [...selTags], photo: photoBlob ? newId() : null,
      at: at.toISOString(), day: localDay(at), createdAt: new Date().toISOString(),
    };
    await store.putEntry(entry, photoBlob);
    justId = entry.id;
    $("text").value = ""; selTags.clear(); clearPhoto(); customWhen = null; $("whenInput").hidden = true;
    try { localStorage.removeItem("papa-draft"); } catch {}
    renderTagPicker(); renderWhen();
    navigator.storage?.persist?.().catch(() => {});
    await loadAll(); renderAll();
    toast("残しました");
  } catch (err) {
    toast(err?.name === "QuotaExceededError"
      ? "スマホの保存容量がいっぱいです。古い写真を削除してください"
      : "保存できませんでした。もう一度押してください");
  } finally {
    btn.textContent = "残す"; updateSaveState();
  }
}
function clearPhoto() {
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoBlob = null; photoUrl = null; $("photo").value = ""; renderPreview(); updateSaveState();
}

/* ---------- backup ---------- */
const blobToDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });

async function exportBackup() {
  try {
    const photos = {};
    for (const e of entries) {
      if (!e.photo) continue;
      const blob = await store.photo(e.photo).catch(() => null);
      if (blob) photos[e.photo] = await blobToDataURL(blob);
    }
    const data = { app: "papa-note", version: 1, exportedAt: new Date().toISOString(), child, entries, photos };
    const file = new Blob([JSON.stringify(data)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(file);
    a.download = `papa-note-backup-${localDay(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    lastBackup = data.exportedAt;
    await store.setSetting("lastBackup", lastBackup);
    renderBackupInfo();
    toast(`${entries.length}件を書き出しました`);
  } catch { toast("書き出せませんでした。もう一度試してください"); }
}

async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data?.app !== "papa-note" || !Array.isArray(data.entries)) throw new Error("format");
    let added = 0;
    const known = new Set(entries.map(e => e.id));
    for (const e of data.entries) {
      if (!e?.id || !e.day || !e.at) continue;
      const src = e.photo && data.photos?.[e.photo];
      const blob = src ? await (await fetch(src)).blob() : null;
      await store.putEntry({ id: e.id, text: String(e.text || ""), tags: Array.isArray(e.tags) ? e.tags : [], photo: blob ? e.photo : null, at: e.at, day: e.day, createdAt: e.createdAt || e.at }, blob);
      if (!known.has(e.id)) added++;
    }
    if (data.child && !child) await store.setSetting("child", data.child);
    await loadAll(); renderAll();
    toast(`読み込みました（新しく${added}件）`);
  } catch { toast("パパノートのバックアップファイルを選んでください"); }
  finally { $("importFile").value = ""; }
}

/* ---------- entries ---------- */
function entryHTML(en, { showDelete = true } = {}) {
  const t = new Date(en.at);
  const tags = (en.tags || []).filter(id => TAG[id]).map(id =>
    `<span class="chip static" style="--c:${TAG[id].c}"><i></i>${TAG[id].label}</span>`).join("");
  const del = !showDelete ? "" : confirmId === en.id
    ? `<span class="confirm">この記録を削除しますか？<button type="button" class="danger" data-del-yes="${esc(en.id)}">削除する</button><button type="button" class="cancel" data-del-no>やめる</button></span>`
    : `<button type="button" class="del" data-del="${esc(en.id)}">削除</button>`;
  return `<article class="entry${(en.tags || []).includes("first") ? " first" : ""}${en.id === justId ? " just" : ""}">
    <time datetime="${esc(en.at)}">${pad(t.getHours())}:${pad(t.getMinutes())}</time>
    <div class="body">
      ${en.text ? `<p>${esc(en.text)}</p>` : ""}
      ${en.photo ? `<img class="photo" data-photo="${esc(en.photo)}" alt="${esc(en.text || "写真")}">` : ""}
      ${tags || showDelete ? `<div class="meta">${tags}${del}</div>` : ""}
    </div>
  </article>`;
}
function groupedHTML(list, opts) {
  const groups = [];
  for (const en of list) {
    const g = groups[groups.length - 1];
    if (g && g.day === en.day) g.items.push(en); else groups.push({ day: en.day, items: [en] });
  }
  return groups.map(g => `<div class="day">
    <div class="day-h"><strong>${dayTitle(g.day)}</strong><span>${esc(ageLabel(g.day))}</span></div>
    ${g.items.map(en => entryHTML(en, opts)).join("")}
  </div>`).join("");
}

function renderTimeline() {
  const el = $("timeline");
  if (!ready && loaded) { el.innerHTML = `<div class="status">このブラウザでは記録を保存できません。プライベートモードをやめるか、別のブラウザで開いてください。</div>`; return; }
  if (!loaded) { el.innerHTML = `<div class="status">読み込み中…</div>`; return; }
  $("countLabel").textContent = entries.length ? `ぜんぶで ${entries.length} 件` : "";
  if (!entries.length) {
    el.innerHTML = `<div class="empty">
      <p class="note">まだ記録はありません。上の欄にひとこと書いて「残す」を押すと、ここに日ごとに並びます。1行で十分です。</p>
      <div class="example"><div class="example-tag">例（保存されていません）</div>
        <div class="day"><div class="day-h"><strong>今日</strong><span>生後92日</span></div>
          ${entryHTML({ id: "ex1", at: new Date(new Date().setHours(21, 10)).toISOString(), text: "お風呂で初めて声を出して笑った。つられてこっちも笑った", tags: ["first", "bath"] }, { showDelete: false })}
          ${entryHTML({ id: "ex2", at: new Date(new Date().setHours(23, 40)).toISOString(), text: "寝かしつけ40分。最後は抱っこでスクワット", tags: ["sleep", "hard"] }, { showDelete: false })}
        </div>
      </div>
    </div>`;
    return;
  }
  el.innerHTML = groupedHTML(entries.slice(0, shown)) +
    (entries.length > shown ? `<button type="button" class="ghost more" id="showMore">もっと見る（残り ${entries.length - shown} 件）</button>` : "");
  hydratePhotos(el);
}

/* ---------- look back ---------- */
function renderMemories() {
  const now = new Date();
  const md = `${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  const today = localDay(now);
  const yearAgo = entries.filter(e => e.day.slice(5) === md && e.day < today);
  const m = new Date(now); m.setMonth(m.getMonth() - 1);
  const monthAgo = m.getDate() === now.getDate() ? entries.filter(e => e.day === localDay(m)) : [];
  const w = new Date(now); w.setDate(w.getDate() - 7);
  const weekAgo = entries.filter(e => e.day === localDay(w));
  const blocks = [];
  if (yearAgo.length) blocks.push(["何年か前の今日", yearAgo]);
  if (monthAgo.length) blocks.push(["1ヶ月前の今日", monthAgo]);
  if (weekAgo.length) blocks.push(["1週間前の今日", weekAgo]);
  $("memories").innerHTML = blocks.length
    ? blocks.map(([label, list]) => `<div class="card memory"><div class="memory-label">${label}</div>${groupedHTML(list, { showDelete: false })}</div>`).join("")
    : `<div class="card memory"><div class="memory-label">あの日の記録</div><p class="note">1週間前・1ヶ月前・1年前の同じ日の記録がここに出てきます。続けるほど楽しみが増えます。</p></div>`;
  hydratePhotos($("memories"));
}

function renderMonth() {
  const y = monthCursor.getFullYear(), mo = monthCursor.getMonth();
  $("monthLabel").textContent = `${y}年${mo + 1}月`;
  const now = new Date();
  $("nextMonth").disabled = y > now.getFullYear() || (y === now.getFullYear() && mo >= now.getMonth());
  const key = `${y}-${pad(mo + 1)}`;
  const list = entries.filter(e => e.day.startsWith(key));
  if (!list.length) { $("monthBody").innerHTML = `<p class="note">この月の記録はまだありません。</p>`; return; }
  const days = new Set(list.map(e => e.day)).size;
  const photos = list.filter(e => e.photo);
  const counts = TAGS.map(t => ({ t, n: list.filter(e => (e.tags || []).includes(t.id)).length })).filter(x => x.n);
  const max = Math.max(1, ...counts.map(x => x.n));
  $("monthBody").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${list.length}</b><span>記録</span></div>
      <div class="stat"><b>${days}</b><span>書いた日</span></div>
      <div class="stat"><b>${photos.length}</b><span>写真</span></div>
    </div>
    ${counts.length ? `<div class="bars">${counts.map(({ t, n }) =>
      `<div class="bar" style="--c:${t.c}"><span>${t.label}</span><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><span class="n">${n}回</span></div>`).join("")}</div>` : ""}
    ${photos.length ? `<div class="grid">${photos.slice(0, 12).map(e => `<img data-photo="${esc(e.photo)}" alt="${esc(e.text || "写真")}">`).join("")}</div>` : ""}`;
  hydratePhotos($("monthBody"));
}

function renderFirsts() {
  const list = entries.filter(e => (e.tags || []).includes("first")).slice().reverse();
  $("firsts").innerHTML = list.length
    ? `<ul class="firsts">${list.map(e => {
        const d = parseDay(e.day);
        const age = ageParts(e.day);
        return `<li><span class="d">${age ? `生後${age.days}日` : `${d.getMonth() + 1}/${d.getDate()}`}</span><p>${esc(e.text || "（写真）")}</p></li>`;
      }).join("")}</ul>`
    : `<p class="note">初めて笑った、初めて寝返りした。そんな日に「はじめて」タグを付けると、ここに年表のように並びます。</p>`;
}

function renderFilter() {
  $("filterPicker").innerHTML = TAGS.map(t =>
    `<button type="button" class="chip" style="--c:${t.c}" data-filter="${t.id}" aria-pressed="${filterTag === t.id}"><i></i>${t.label}</button>`).join("");
  const list = entries.filter(e => (e.tags || []).includes(filterTag));
  $("filtered").innerHTML = list.length ? groupedHTML(list.slice(0, 60), { showDelete: false })
    : `<p class="note">「${TAG[filterTag].label}」の記録はまだありません。</p>`;
  hydratePhotos($("filtered"));
}

function renderAll() {
  renderHeader();
  renderBackupInfo();
  updateSaveState();
  if (tab === "write") renderTimeline();
  else { renderMemories(); renderMonth(); renderFirsts(); renderFilter(); }
}

/* ---------- misc ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2600);
}
function setTab(next) {
  tab = next;
  $("tabWrite").setAttribute("aria-selected", next === "write");
  $("tabLook").setAttribute("aria-selected", next === "look");
  $("paneWrite").hidden = next !== "write";
  $("paneLook").hidden = next !== "look";
  try { localStorage.setItem("papa-tab", next); } catch {}
  renderAll();
}
function openSettings(open) {
  $("settings").hidden = !open;
  if (open) { $("setName").value = child?.name || ""; $("setBirth").value = child?.birthday || ""; }
}

/* ---------- events ---------- */
$("tabWrite").onclick = () => setTab("write");
$("tabLook").onclick = () => setTab("look");
$("openSettings").onclick = () => openSettings($("settings").hidden);
$("cancelSettings").onclick = () => openSettings(false);
$("saveSettings").onclick = async () => {
  if (!ready) return toast("このブラウザでは保存できません");
  try {
    child = { name: $("setName").value.trim(), birthday: $("setBirth").value || null };
    await store.setSetting("child", child);
    openSettings(false); renderAll(); toast("保存しました");
  } catch { toast("保存できませんでした。もう一度押してください"); }
};
$("exportBtn").onclick = exportBackup;
$("reminderBtn").onclick = exportBackup;
$("importFile").onchange = () => { const f = $("importFile").files?.[0]; if (f) importBackup(f); };
$("tagPicker").onclick = e => {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  const id = b.dataset.tag; selTags.has(id) ? selTags.delete(id) : selTags.add(id);
  b.setAttribute("aria-pressed", selTags.has(id));
};
$("text").addEventListener("input", () => {
  updateSaveState();
  try { localStorage.setItem("papa-draft", $("text").value); } catch {}
});
$("photo").onchange = async () => {
  const f = $("photo").files?.[0]; if (!f) return;
  photoBlob = await shrink(f);
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(photoBlob);
  renderPreview(); updateSaveState();
};
$("previewSlot").onclick = e => { if (e.target.id === "dropPhoto") clearPhoto(); };
$("whenBtn").onclick = () => {
  const inp = $("whenInput"); inp.hidden = !inp.hidden;
  if (!inp.hidden) { inp.value = toLocalInput(customWhen || new Date()); inp.focus(); }
};
$("whenInput").onchange = () => {
  const v = $("whenInput").value; customWhen = v ? new Date(v) : null; renderWhen();
};
$("composer").onsubmit = save;
$("timeline").onclick = async e => {
  if (e.target.id === "showMore") { shown += 40; renderTimeline(); return; }
  const del = e.target.closest("[data-del]"); if (del) { confirmId = del.dataset.del; renderTimeline(); return; }
  if (e.target.closest("[data-del-no]")) { confirmId = null; renderTimeline(); return; }
  const yes = e.target.closest("[data-del-yes]");
  if (yes) {
    const en = entries.find(x => x.id === yes.dataset.delYes); confirmId = null;
    if (!en) return;
    try {
      await store.deleteEntry(en);
      if (en.photo && photoURLs.has(en.photo)) { URL.revokeObjectURL(photoURLs.get(en.photo)); photoURLs.delete(en.photo); }
      await loadAll(); renderAll();
      toast("削除しました");
    } catch { toast("削除できませんでした。もう一度試してください"); renderTimeline(); }
  }
};
$("filterPicker").onclick = e => {
  const b = e.target.closest("[data-filter]"); if (!b) return;
  filterTag = b.dataset.filter; renderFilter();
};
$("prevMonth").onclick = () => { monthCursor.setMonth(monthCursor.getMonth() - 1); renderMonth(); };
$("nextMonth").onclick = () => { monthCursor.setMonth(monthCursor.getMonth() + 1); renderMonth(); };
setInterval(() => { if (!customWhen) renderWhen(); }, 30000);

/* ---------- boot ---------- */
try { $("text").value = localStorage.getItem("papa-draft") || ""; } catch {}
let startTab = "write";
try { if (localStorage.getItem("papa-tab") === "look") startTab = "look"; } catch {}
renderTagPicker(); renderWhen(); renderPreview();
setTab(startTab);

(async () => {
  try {
    await store.open();
    ready = true;
    await loadAll();
  } catch {
    loaded = true;
  }
  renderAll();
})();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
